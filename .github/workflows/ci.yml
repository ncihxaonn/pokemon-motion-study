name: Verify motion
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run models:fetch
      - run: npm run test:rig
      - run: npm run build
      - name: Exclude downloaded models from the public package
        run: test ! -d dist/models
